name: CI/CD - IIS Dashboard 

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v4.2.0
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4.2.0
        with:
          useConfigFile: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install & Build Client
        working-directory: ./client
        run: |
          npm ci
          VITE_APP_VERSION=${{ steps.gitversion.outputs.semVer }} npm run build
        # Output is now in client/dist

      # 3. Build Backend (Server)
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish .NET Server
        run: |
          dotnet publish server/server.csproj -c Release -o ./publish /p:Version=${{ steps.gitversion.outputs.semVer }}

      - name: Integrate Client
        run: |
          mkdir -p ./publish/wwwroot
          cp -r client/dist/* ./publish/wwwroot/

      - name: Create Zip Release
        run: |
          cd publish
          zip -r ../iis-dash-v${{ steps.gitversion.outputs.semVer }}.zip .

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: Release v${{ steps.gitversion.outputs.semVer }}
          files: iis-dash-v${{ steps.gitversion.outputs.semVer }}.zip
          generate_release_notes: true
